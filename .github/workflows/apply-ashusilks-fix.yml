name: Apply Ashu Silks verified repair

on:
  push:
    branches:
      - fix/ashu-verified-patch

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and apply the tested patch
        shell: bash
        run: |
          git fetch origin fix/ashu-verified-patch
          git show origin/fix/ashu-verified-patch:scripts/ashusilks-fix.patch.gz.b64 \
            | base64 --decode | gzip --decompress > /tmp/ashusilks-fix.patch
          git apply --check /tmp/ashusilks-fix.patch
          git apply /tmp/ashusilks-fix.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Commit verified source changes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src tests
          git commit -m "Fix product media handling and admin configuration errors"
          git push origin HEAD:main
